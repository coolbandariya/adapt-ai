name: Python CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check local-only execution guard
        run: |
          python -c "from pathlib import Path; s=Path(\"app.py\").read_text(); assert \"ADAPT_ENABLE_CODE_EXECUTION\" in s; assert \"ADAPT_HOST\" in s; assert \"127.0.0.1\" in s; assert \"allow_origins=[\" in s"
